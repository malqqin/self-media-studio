<title id="fn-art-title">骑着自行车寻找科学灵感的鹈鹕</title>
<desc id="fn-art-desc">海风、云朵和暖黄色太阳下，一只戴橘色围巾的鹈鹕骑着绿色自行车，车后带着观星手记。车轮与脚踏缓缓转动，可用右下角按钮暂停。</desc>
